{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Smart Task Board</title>
  <meta name="description" content="Sign in to your Smart Task Board account." />
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <!-- Header -->
    <div class="login-card-header">
      <div class="login-logo">T</div>
      <h1>Welcome back</h1>
      <p>Sign in to your Task Board account</p>
    </div>

    <!-- Body -->
    <div class="login-card-body">

      {% if error %}
      <div class="login-error" id="login-error">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="flex-shrink:0">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" novalidate>
        {% csrf_token %}

        <div class="form-group">
          <label class="form-label" for="id_username">Username</label>
          <input
            type="text"
            id="id_username"
            name="username"
            class="form-control"
            placeholder="Enter your username"
            autocomplete="username"
            autofocus
            value="{{ request.POST.username|default:'' }}"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="id_password">
            Password
          </label>
          <div style="position:relative;">
            <input
              type="password"
              id="id_password"
              name="password"
              class="form-control"
              placeholder="Enter your password"
              autocomplete="current-password"
              style="padding-right: 40px;"
            />
            <button
              type="button"
              id="toggle-password"
              title="Show/hide password"
              style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:0;display:flex;align-items:center;"
              aria-label="Toggle password visibility"
            >
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary login-submit">
          Sign In
        </button>
      </form>

    </div>

    <!-- Footer -->
    <div class="login-card-footer">
      Smart Task Board &copy; 2026
    </div>

  </div>
</div>

<script>
  // Toggle password visibility
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('id_password');
  const eyeIcon = document.getElementById('eye-icon');

  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    eyeIcon.innerHTML = isPassword
      ? `<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />`
      : `<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />`;
  });
</script>

</body>
</html>
